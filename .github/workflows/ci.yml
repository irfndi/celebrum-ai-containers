name: CI

# CI Strategy:
# - Run tests and security analysis on ALL branches and PRs
# - Deploy to production only from main branch
on:
  push:
    branches: ["**"]  # Run on all branches
  pull_request:
    branches: ["**"]  # Run on PRs to all branches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Go-specific checks and tests
  go-checks:
    name: Go Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.54.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Check Go formatting
        run: |
          if [ -n "$(find . -name '*.go' -not -path './vendor/*')" ]; then
            gofmt -l $(find . -name '*.go' -not -path './vendor/*') | tee /tmp/gofmt.out
            test ! -s /tmp/gofmt.out
          else
            echo "No Go files found"
          fi

      - name: Run Go linter
        run: |
          if [ -f "go.mod" ]; then
            golangci-lint run
          else
            echo "No Go modules found"
          fi

      - name: Run Go tests
        run: |
          if [ -f "go.mod" ]; then
            go test -v ./...
          else
            echo "No Go modules found"
          fi

      - name: Build Go services
        run: |
          if [ -f "go.mod" ]; then
            go build ./...
          else
            echo "No Go modules found"
          fi

  # TypeScript/Node.js checks and tests
  typescript-checks:
    name: TypeScript Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=\"$(pnpm store path --silent)\"" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache TypeScript build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/build
            packages/*/.astro
          key: ${{ runner.os }}-ts-build-${{ hashFiles('packages/*/src/**/*', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-ts-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies first
        run: pnpm --filter @celebrum-ai/db run build && pnpm --filter @celebrum-ai/shared run build

      - name: Lint TypeScript packages
        run: pnpm run lint

      - name: Type check all packages
        run: make typecheck

      - name: Build TypeScript packages
        run: pnpm run build

      - name: Test TypeScript packages
        run: pnpm run test

  # Cloudflare Workers deployment test
  wrangler-test:
    name: Wrangler Deploy Test
    runs-on: ubuntu-latest
    needs: [go-checks, typescript-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies first
        run: pnpm --filter @celebrum-ai/db run build && pnpm --filter @celebrum-ai/shared run build

      - name: Build TypeScript packages
        run: pnpm run build

      - name: Build Go services (if any)
        run: |
          if [ -f "go.mod" ]; then
            go build ./...
          else
            echo "No Go modules found"
          fi

      - name: Test Wrangler Deploy
        run: wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: [go-checks, typescript-checks]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript-typescript']
        include:
          - language: go
            setup-go: true
          - language: javascript-typescript
            setup-node: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality
        env:
          CODEQL_ENABLE_EXPERIMENTAL_FEATURES: true

      - name: Setup Go
        if: matrix.setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        if: matrix.setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        if: matrix.setup-node
        uses: pnpm/action-setup@v4
        with:
          version: '10.12.1'
          run_install: false

      - name: Install dependencies
        if: matrix.setup-node
        run: pnpm install --frozen-lockfile

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  deploy:
    name: Deploy to Cloudflare
    needs: [go-checks, typescript-checks, wrangler-test, codeql]
    # Only deploy from main branch on push (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=\"$(pnpm store path --silent)\"" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies first
        run: pnpm --filter @celebrum-ai/db run build && pnpm --filter @celebrum-ai/shared run build

      - name: Build TypeScript packages
        run: pnpm run build

      - name: Install wrangler
        run: pnpm add -g wrangler@latest

      - name: Deploy Core Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Telegram Bot
        run: pnpm run deploy:telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Web App
        run: pnpm run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
