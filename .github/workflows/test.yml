name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install system packages for native modules
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev build-essential python3 python-is-python3
    - name: Set build flags for native modules
      run: |
        echo "npm_config_build_from_source=true" >> $GITHUB_ENV
        echo "npm_config_python=python3" >> $GITHUB_ENV
    - name: Clean node_modules and pnpm store
      run: |
        rm -rf node_modules
        pnpm store prune
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Rebuild native modules
      run: pnpm rebuild --recursive
    - name: Rebuild better-sqlite3 directly
      run: pnpm rebuild better-sqlite3
    - name: Debug better-sqlite3 build
      run: ls -alR node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/
    - name: Show Node version and arch
      run: node -p "process.version + ' ' + process.arch + ' ' + process.platform"
    - name: ldd on better_sqlite3.node
      run: |
        find node_modules -name better_sqlite3.node -exec ldd {} \; || echo "better_sqlite3.node not found"
    - name: Approve native builds
      run: pnpm approve-builds
      
    - name: Type checking
      run: pnpm typecheck
      
    - name: Linting
      run: pnpm lint
      
    - name: Run unit tests
      run: pnpm test:unit
      
    - name: Run integration tests
      run: pnpm test:integration
      
    - name: Run E2E tests
      run: pnpm test:e2e
      
    - name: Generate coverage report
      run: pnpm test:coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage/
          test-results.xml
          
  test-matrix:
    name: Test Matrix
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-type: [telegram, web, shared, services, db]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        
    - name: Install system packages for native modules
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev build-essential python3 python-is-python3
    - name: Set build flags for native modules
      run: |
        echo "npm_config_build_from_source=true" >> $GITHUB_ENV
        echo "npm_config_python=python3" >> $GITHUB_ENV
    - name: Clean node_modules and pnpm store
      run: |
        rm -rf node_modules
        pnpm store prune
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Rebuild native modules
      run: pnpm rebuild --recursive
    - name: Rebuild better-sqlite3 directly
      run: pnpm rebuild better-sqlite3
    - name: Debug better-sqlite3 build
      run: ls -alR node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/
    - name: Show Node version and arch
      run: node -p "process.version + ' ' + process.arch + ' ' + process.platform"
    - name: ldd on better_sqlite3.node
      run: |
        find node_modules -name better_sqlite3.node -exec ldd {} \; || echo "better_sqlite3.node not found"
    - name: Approve native builds
      run: pnpm approve-builds
      
    - name: Run ${{ matrix.test-type }} tests
      run: pnpm test:${{ matrix.test-type }}
      
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        
    - name: Install system packages for native modules
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev build-essential python3 python-is-python3
    - name: Set build flags for native modules
      run: |
        echo "npm_config_build_from_source=true" >> $GITHUB_ENV
        echo "npm_config_python=python3" >> $GITHUB_ENV
    - name: Clean node_modules and pnpm store
      run: |
        rm -rf node_modules
        pnpm store prune
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Rebuild native modules
      run: pnpm rebuild --recursive
    - name: Rebuild better-sqlite3 directly
      run: pnpm rebuild better-sqlite3
    - name: Debug better-sqlite3 build
      run: ls -alR node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/
    - name: Show Node version and arch
      run: node -p "process.version + ' ' + process.arch + ' ' + process.platform"
    - name: ldd on better_sqlite3.node
      run: |
        find node_modules -name better_sqlite3.node -exec ldd {} \; || echo "better_sqlite3.node not found"
    - name: Approve native builds
      run: pnpm approve-builds
      
    - name: Run performance tests
      run: pnpm test:e2e --reporter=json --outputFile=performance-results.json
      
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results.json
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        
    - name: Install system packages for native modules
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev build-essential python3 python-is-python3
    - name: Set build flags for native modules
      run: |
        echo "npm_config_build_from_source=true" >> $GITHUB_ENV
        echo "npm_config_python=python3" >> $GITHUB_ENV
    - name: Clean node_modules and pnpm store
      run: |
        rm -rf node_modules
        pnpm store prune
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Rebuild native modules
      run: pnpm rebuild --recursive
    - name: Rebuild better-sqlite3 directly
      run: pnpm rebuild better-sqlite3
    - name: Debug better-sqlite3 build
      run: ls -alR node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3/
    - name: Show Node version and arch
      run: node -p "process.version + ' ' + process.arch + ' ' + process.platform"
    - name: ldd on better_sqlite3.node
      run: |
        find node_modules -name better_sqlite3.node -exec ldd {} \; || echo "better_sqlite3.node not found"
    - name: Approve native builds
      run: pnpm approve-builds
      
    - name: Run security audit
      run: pnpm audit --audit-level moderate
      
    - name: Check for vulnerabilities
      run: pnpm audit --json > security-audit.json || true
      
    - name: Upload security audit
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit
        path: security-audit.json