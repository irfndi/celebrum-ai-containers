name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        
    - name: Install system packages for native modules
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev build-essential python3 python-is-python3
    - name: Enable native module builds
      run: |
        echo "npm_config_build_from_source=true" >> $GITHUB_ENV
        echo "npm_config_python=python3" >> $GITHUB_ENV
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --workspace-root
    - name: Reinstall better-sqlite3 from source
      run: npm_config_build_from_source=true npm_config_python=python3 npm install better-sqlite3 --no-save --build-from-source
      
    - name: Type checking
      run: pnpm typecheck
      
    - name: Linting
      run: pnpm lint
      
    - name: Run unit tests
      run: pnpm test:unit
      
    - name: Run integration tests
      run: pnpm test:integration
      
    - name: Run E2E tests
      run: pnpm test:e2e
      
    - name: Generate coverage report
      run: pnpm test:coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage/
          test-results.xml
          
  test-matrix:
    name: Test Matrix
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-type: [telegram, web, shared, services, db]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'
        
    - name: Install system packages for native modules
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev build-essential python3 python-is-python3
    - name: Enable native module builds
      run: |
        echo "npm_config_build_from_source=true" >> $GITHUB_ENV
        echo "npm_config_python=python3" >> $GITHUB_ENV
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --workspace-root
    - name: Reinstall better-sqlite3 from source
      run: npm_config_build_from_source=true npm_config_python=python3 npm install better-sqlite3 --no-save --build-from-source
      
    - name: Run ${{ matrix.test-type }} tests
      run: pnpm test:${{ matrix.test-type }}
      
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --workspace-root
    - name: Reinstall better-sqlite3 from source
      run: npm_config_build_from_source=true npm_config_python=python3 npm install better-sqlite3 --no-save --build-from-source
      
    - name: Run performance tests
      run: pnpm test:e2e --reporter=json --outputFile=performance-results.json
      
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results.json
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --workspace-root
    - name: Reinstall better-sqlite3 from source
      run: npm_config_build_from_source=true npm_config_python=python3 npm install better-sqlite3 --no-save --build-from-source
      
    - name: Run security audit
      run: pnpm audit --audit-level moderate
      
    - name: Check for vulnerabilities
      run: pnpm audit --json > security-audit.json || true
      
    - name: Upload security audit
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit
        path: security-audit.json